name: Pytest Tests

# Ubuntu is optimal for tests
# checkout@v4 pulls repo
# installs python 3.12
# installs dependencies incl. in our repo
# verbose and short error msgs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/envDependencies.txt
          pip install pytest pytest-cov

      - name: Run tests
        working-directory: ./
        env:
          PYTHONPATH: /home/runner/work/munchmate/munchmate/backend
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          pytest tests/unit -v --tb=short --cov=backend --cov-report=term-missing
